<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نمونه‌کارها</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800;900&display=swap" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box;margin:0}
body{font:400 16px/1.9 "Vazirmatn",Tahoma,sans-serif;background:#f2f1ee;color:#1d1d1f;padding:8vh 5vw}
h1{font:900 clamp(2.4rem,7vw,5rem)/1.3}
p{max-width:46ch;margin:8px 0 40px;opacity:.75}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
a{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:260px;padding:22px;border-radius:6px 6px 6px 60px;background:var(--c);color:var(--t);text-decoration:none;overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),border-radius .4s}
a:hover,a:focus-visible{transform:translateY(-8px);border-radius:6px 6px 60px 6px;outline:3px solid #1d1d1f;outline-offset:3px}
b{font:900 1.7rem/1.4}
span{opacity:.85}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>نمونه‌کارها</h1>
<p>چهار دموی فرانت‌اند با طراحی و حال‌وهوای متفاوت. روی هر کدام بزنید.</p>
<div class="g">
<a href="clothing/" style="--c:#2438f0;--t:#fff"><b>پوشاک</b><span>کوک: رخت‌آویز و رنگ روز</span></a>
<a href="gym/" style="--c:#ffd60a;--t:#10163a"><b>باشگاه</b><span>فولاد: هالتر را ببند</span></a>
<a href="realestate/" style="--c:#0e3b43;--t:#fff"><b>املاک</b><span>آفتاب: ساعت روز و افق شهر</span></a>
<a href="pharmacy/" style="--c:#0b4f3c;--t:#d8f2e4"><b>داروخانه</b><span>سبز: قرص‌دان هفتگی</span></a>
</div>
</body>
</html>
